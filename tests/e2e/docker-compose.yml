# End-to-end stack of tests/run-e2e.sh. The network is internal: hindsight
# reaches nothing outside the stack, which proves that it starts and embeds
# without downloading anything. The keys are test values of this stack only.
name: hindsight-e2e

services:
  hindsight:
    image: mwaeckerlin/hindsight
    environment:
      HINDSIGHT_API_WORKER_ID: hindsight
      # the mock LLM derives facts from the stored text, no LLM needed
      HINDSIGHT_API_LLM_PROVIDER: mock
      HINDSIGHT_API_LLM_MODEL: mock-model
      # the key alone switches the key check on
      HINDSIGHT_API_TENANT_API_KEY_FILE: /run/secrets/tenant_key
    secrets:
      - tenant_key
    volumes:
      - data:/data
    stop_grace_period: 30s
    networks:
      - e2e

  # the same image without a key: it runs open, for a network isolated otherwise
  hindsight-open:
    image: mwaeckerlin/hindsight
    environment:
      HINDSIGHT_API_WORKER_ID: hindsight-open
      HINDSIGHT_API_LLM_PROVIDER: mock
      HINDSIGHT_API_LLM_MODEL: mock-model
    networks:
      - e2e

  # the web interface in front of the service with the key, behind its own login
  control-plane:
    image: mwaeckerlin/hindsight:control-plane
    environment:
      HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight:8888
      HINDSIGHT_CP_DATAPLANE_API_KEY_FILE: /run/secrets/tenant_key
      HINDSIGHT_CP_ACCESS_KEY_FILE: /run/secrets/access_key
    secrets:
      - tenant_key
      - access_key
    networks:
      - e2e

  # the web interface without a login, in front of the open service
  control-plane-open:
    image: mwaeckerlin/hindsight:control-plane
    environment:
      HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight-open:8888
    networks:
      - e2e

  # the web interface below the base path the image is built for, behind its login
  control-plane-base-path:
    image: mwaeckerlin/hindsight:control-plane
    environment:
      HINDSIGHT_BASE_PATH: /hindsight
      HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight:8888
      HINDSIGHT_CP_DATAPLANE_API_KEY_FILE: /run/secrets/tenant_key
      HINDSIGHT_CP_ACCESS_KEY_FILE: /run/secrets/access_key
    secrets:
      - tenant_key
      - access_key
    networks:
      - e2e

  # Traefik with the route of the deployment: PathPrefix(`/hindsight`), no StripPrefix
  proxy:
    build: proxy
    image: mwaeckerlin/hindsight-e2e-proxy
    user: "65534:65534"
    networks:
      - e2e

  # Chromium through the proxy below /hindsight, and at the root without a base path
  browser:
    build: browser
    image: mwaeckerlin/hindsight-e2e-browser
    environment:
      PROXY_URL: http://proxy:8080
      PREFIX: /hindsight
      ROOT_URL: http://control-plane:9999
      HINDSIGHT_TEST_ACCESS_KEY: e2e-access-key-of-the-test-stack
    networks:
      - e2e

  check:
    build: .
    image: mwaeckerlin/hindsight-e2e-check
    environment:
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_TEST_KEY: e2e-tenant-key-of-the-test-stack
      HINDSIGHT_TEST_ACCESS_KEY: e2e-access-key-of-the-test-stack
    networks:
      - e2e

secrets:
  tenant_key:
    environment: HINDSIGHT_E2E_TENANT_KEY
  access_key:
    environment: HINDSIGHT_E2E_ACCESS_KEY

volumes:
  data:

networks:
  e2e:
    internal: true
